services:
  app:
    container_name: vvibecoder-sim
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8040:3000"
    volumes:
      - leaderboard-data:/app/data
    environment:
      VVIBECODER_DATA_DIR: /app/data
      VVIBECODER_ANALYTICS_SECRET: ${VVIBECODER_ANALYTICS_SECRET:?VVIBECODER_ANALYTICS_SECRET is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  leaderboard-data:
